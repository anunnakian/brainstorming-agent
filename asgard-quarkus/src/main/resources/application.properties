# Chat model used by the hat agents (both OpenAI and Anthropic extensions are on the classpath)
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.openai.api-key=${OPEN_AI_API_KEY}
quarkus.langchain4j.openai.timeout=120s
quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY}

quarkus.langchain4j.chat-memory.memory-window.max-messages=20
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

